apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: viniciustda/tp3-dashboard:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 50131
        env:
        - name: REDIS_HOST
          value: "192.168.121.171"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_OUTPUT_KEY
          value: "viniciusabel-proj3-output"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-svc
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 50131
      targetPort: 50131
      nodePort: 50131