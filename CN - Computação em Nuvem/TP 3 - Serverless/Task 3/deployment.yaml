---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serverless-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serverless-redis
  template:
    metadata:
      labels:
        app: serverless-redis
    spec:
      containers:
      - name: serverless-redis
        image: viniciustda/tp3-runtime:v1
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        volumeMounts:
        - name: pyfile
          mountPath: "/opt/usermodule.py"
          subPath: pyfile
        env:
        - name: REDIS_HOST
          value: "192.168.121.171"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_INPUT_KEY
          value: "metrics"
        # Configurações adicionais do Runtime (Task 3)
        - name: MONITORING_PERIOD
          value: "5.0"
        - name: HANDLER_NAME
          value: "handler"
        # Para usar um arquivo ZIP, descomente e configure o volume correspondente
        # - name: ZIP_FILE_PATH
        #   value: "/opt/userfunction.zip"
        - name: REDIS_OUTPUT_KEY
          valueFrom:
            configMapKeyRef:
              name: outputkey
              key: REDIS_OUTPUT_KEY
      volumes:
      - name: pyfile
        configMap:
          name: pyfile